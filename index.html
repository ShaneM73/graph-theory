  const el=renderer.domElement;
  el.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,id:e.pointerId};lastTouch=performance.now();});
  window.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;cam.theta-=dx*.007;cam.phi=Math.min(2.85,Math.max(.18,cam.phi-dy*.007));lastTouch=performance.now();});
  window.addEventListener('pointerup',e=>{if(!drag||e.pointerId!==drag.id)return;if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<6)pick(e);drag=null;});
  window.addEventListener('pointercancel',()=>{drag=null;});
  el.addEventListener('wheel',e=>{e.preventDefault();cam.gR=Math.min(70,Math.max(5,cam.gR*(1+e.deltaY*.0011)));lastTouch=performance.now();},{passive:false});
  requestAnimationFrame(frame);
}
function pick(e){
  const r=renderer.domElement.getBoundingClientRect();
  const v=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  const rc=new THREE.Raycaster();rc.setFromCamera(v,camera);
  const hit=rc.intersectObjects(Object.values(NO).map(o=>o.mesh))[0];
  setSel(hit?hit.object.userData.id:null);
}
function setSel(id){sel=sel===id?null:id;applyRoles();markSel();}
function markSel(){document.querySelectorAll('#panel [data-node]').forEach(el=>el.classList.toggle('selx',!!sel&&el.dataset.node===sel));}

const sphereGeo=()=>new THREE.SphereGeometry(NODE_R,32,24);
function buildScene(){
  labels.innerHTML='';NO={};ELAB=[];anim=null;
  if(renderer){
    [nodeGroup,edgeGroup].forEach(g=>g.children.slice().forEach(m=>{g.remove(m);m.geometry.dispose();m.material.dispose();}));
  }
  G.nodes.forEach(n=>{
    const o={id:n.id,cur:new V3(...n.p),from:new V3(...n.p),to:new V3(...n.p),role:'none'};
    o.el=document.createElement('div');o.el.className='nlab';o.el.innerHTML=`<span class="nm">${esc(n.label)}</span><span class="sb"></span>`;o.sub=o.el.querySelector('.sb');labels.appendChild(o.el);
    if(renderer){
      o.mesh=new THREE.Mesh(sphereGeo(),new THREE.MeshStandardMaterial({color:0xEEF2F7,roughness:.42,metalness:.05}));o.mesh.userData.id=n.id;
      o.outline=new THREE.Mesh(sphereGeo(),new THREE.MeshBasicMaterial({color:0x9FB0CC,side:THREE.BackSide,transparent:true,opacity:.22}));
      o.mesh.position.copy(o.cur);o.outline.position.copy(o.cur);nodeGroup.add(o.mesh,o.outline);
    }

  });
  G.edges.forEach(()=>{const el=document.createElement('div');el.className='elab';labels.appendChild(el);ELAB.push({el,pos:new V3(),text:''});});
  if(renderer){const minY=Math.min(...G.nodes.map(n=>n.p[1]));grid.position.y=minY-1.8;}
}
function fit(posOf,instant){
  const pts=G.nodes.map(n=>posOf(n));const c=new V3();pts.forEach(p=>c.add(p));c.multiplyScalar(1/pts.length);
  let R=0;pts.forEach(p=>R=Math.max(R,p.distanceTo(c)));
  cam.gT.copy(c);cam.gR=Math.min(46,Math.max(11,R*2.55+4.5));
  if(instant){cam.t.copy(cam.gT);cam.r=cam.gR;}
}
function edgeState(i){const s=curStep,f=s.focus||{};if(f.e&&f.e.includes(i))return f.est||'consider';if(f.pe&&f.pe.includes(i))return f.pest||'cycle';return s.edges[i].st;}
function rebuildEdges(){
  if(!curStep)return;
  if(renderer)edgeGroup.children.slice().forEach(m=>{edgeGroup.remove(m);m.geometry.dispose();m.material.dispose();});
  G.edges.forEach((e,i)=>{
    const st=edgeState(i),S=EST[st]||EST.idle,a=NO[e.u].cur,b=NO[e.v].cur;let cv;
    if(e.u===e.v){cv=new THREE.CubicBezierCurve3(a.clone().add(new V3(-.26,.3,0)),a.clone().add(new V3(-1.15,1.8,0)),a.clone().add(new V3(1.15,1.8,0)),a.clone().add(new V3(.26,.3,0)));}
    else{const mid=a.clone().add(b).multiplyScalar(.5),dir=b.clone().sub(a),len=dir.length();dir.normalize();
      if(curStep.arc)mid.y+=Math.min(.24*len,3);
      else if(G.directed&&G.rev.has(e.v+'>'+e.u)){const p=new V3().crossVectors(dir,Y);if(p.lengthSq()<1e-4)p.set(1,0,0);p.normalize().multiplyScalar(.55);mid.add(p);}
      cv=new THREE.QuadraticBezierCurve3(a.clone(),mid,b.clone());}
    const L=ELAB[i];L.pos.copy(cv.getPoint(.5));L.pos.y+=e.u===e.v?.2:.28;L.text=curStep.edges[i].lab||'';L.el.textContent=L.text;L.el.className='elab s-'+st;
    if(!renderer)return;
    const R0=NODE_R+.05;let ta=walk(cv,a,0,.004,R0),tb=walk(cv,b,1,-.004,R0);
    const mk=()=>new THREE.MeshStandardMaterial({color:S.c,emissive:S.c,emissiveIntensity:S.g||.15,roughness:.55,transparent:S.o<1,opacity:S.o});
    if(G.directed){const Hh=.38,fwd=!curStep.flip,tipT=fwd?tb:ta,tip=cv.getPoint(tipT),baseT=walk(cv,tip,tipT,fwd?-.004:.004,Hh),base=cv.getPoint(baseT);
      if(fwd)tb=baseT;else ta=baseT;
      const cone=new THREE.Mesh(new THREE.ConeGeometry(Math.max(.13,S.r*2.1),Hh,18),mk());cone.position.copy(base).add(tip).multiplyScalar(.5);cone.quaternion.setFromUnitVectors(Y,tip.clone().sub(base).normalize());edgeGroup.add(cone);}
    if(tb>ta)edgeGroup.add(new THREE.Mesh(new THREE.TubeGeometry(new Sub(cv,ta,tb),e.u===e.v?32:22,S.r,8,false),mk()));
  });
}
function applyRoles(){
  const f=(curStep&&curStep.focus)||{};
  G.nodes.forEach(n=>{const o=NO[n.id];o.role=sel===n.id?'sel':(f.n&&f.n.includes(n.id))?'cur':(f.t&&f.t.includes(n.id))?'tgt':'none';
    if(o.outline){const r=ROLE[o.role];o.outline.material.color.setHex(r.c);o.outline.material.opacity=r.o;o.outline.scale.setScalar(r.s);}});
}
const tmp=new V3();
function placeLabels(){
  const w=host.clientWidth,h=host.clientHeight;
  G.nodes.forEach(n=>{const o=NO[n.id];tmp.copy(o.cur);tmp.y-=.6;tmp.project(camera);
    if(tmp.z>1||tmp.z<-1){o.el.style.display='none';return;}o.el.style.display='';
    o.el.style.transform=`translate(${((tmp.x+1)/2*w).toFixed(1)}px,${((1-tmp.y)/2*h).toFixed(1)}px) translate(-50%,0)`;o.el.style.zIndex=String(2000-Math.round(tmp.z*1000));});
  ELAB.forEach(L=>{if(!L.text){L.el.style.display='none';return;}tmp.copy(L.pos).project(camera);if(tmp.z>1){L.el.style.display='none';return;}L.el.style.display='';
    L.el.style.transform=`translate(${((tmp.x+1)/2*w).toFixed(1)}px,${((1-tmp.y)/2*h).toFixed(1)}px) translate(-50%,-50%)`;L.el.style.zIndex=String(1000-Math.round(tmp.z*900));});
}
function frame(now){
  requestAnimationFrame(frame);
  if(!G)return;
  if(anim){const k=Math.min(1,(now-anim.t0)/anim.dur),e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
    G.nodes.forEach(n=>{const o=NO[n.id];o.cur.lerpVectors(o.from,o.to,e);o.mesh.position.copy(o.cur);o.outline.position.copy(o.cur);});rebuildEdges();if(k>=1)anim=null;}
  if(spin&&!drag&&now-lastTouch>3500)cam.theta+=.0016;
  cam.t.lerp(cam.gT,.07);cam.r+=(cam.gR-cam.r)*.08;
  if(!reduce)G.nodes.forEach(n=>{const o=NO[n.id];if(o.role==='cur')o.outline.scale.setScalar(1.24+.06*Math.sin(now/170));});
  camera.position.set(cam.t.x+cam.r*Math.sin(cam.phi)*Math.sin(cam.theta),cam.t.y+cam.r*Math.cos(cam.phi),cam.t.z+cam.r*Math.sin(cam.phi)*Math.cos(cam.theta));
  camera.lookAt(cam.t);
  renderer.render(scene,camera);placeLabels();
}

/* ---------- UI ---------- */
function renderRail(){
  const groups=[...new Set(MODS.map(m=>m.group))];
  $('#rail').innerHTML=groups.map(g=>`<div class="grp"><h5>${g}</h5><div>${MODS.filter(m=>m.group===g).map(m=>`<button data-mod="${m.id}" aria-current="${mod&&mod.id===m.id}">${m.name}<small>${m.short}</small></button>`).join('')}</div></div>`).join('');
  $('#rail').querySelectorAll('button').forEach(b=>b.onclick=()=>{location.hash=b.dataset.mod;});
}
function renderLesson(){
  const k=MODS.indexOf(mod)+1,ex=mod.examples[exIdx];
  $('#lesson').innerHTML=`<div class="eyebrow">${mod.group} · Module ${k} of ${MODS.length}</div><h1>${mod.name}</h1><p class="idea">${mod.idea}</p>
  <div class="facts">${mod.facts.map(([a,b])=>`<div class="fact"><span>${a}</span><b>${b}</b></div>`).join('')}</div>
  <div class="exs"><span>Example</span>${mod.examples.map((e,j)=>`<button data-ex="${j}" aria-pressed="${j===exIdx}">${e.name}</button>`).join('')}</div>
  <p class="exnote">${ex.note||''}</p>`;
  $('#lesson').querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>load(mod.id,+b.dataset.ex));
  $('#keys').innerHTML=mod.takeaways.map(t=>`<li>${t}</li>`).join('');
  $('#traps').innerHTML=mod.traps.map(t=>`<li>${t}</li>`).join('');
  $('#legend').innerHTML=mod.legend.map(([kind,key,label])=>{
    const sw=kind==='n'?`<i class="nd" style="background:${fillCss(key)}"></i>`:kind==='e'?`<i class="ln" style="background:${hexCss((EST[key]||EST.idle).c)}"></i>`:`<i class="rg" style="border-color:${hexCss(ROLE[key].c)}"></i>`;
    return `<span class="lg">${sw}${label}</span>`;}).join('');
  if(!mod.code){$('#codeH').textContent='Cost comparison';$('#code').innerHTML=`<table class="cmp"><thead><tr><th></th><th>Adj. list</th><th>Adj. matrix</th></tr></thead><tbody>
    <tr><td>Memory</td><td><b>Θ(V + E)</b></td><td><b>Θ(V²)</b></td></tr><tr><td>List neighbors of u</td><td><b>Θ(deg u)</b></td><td><b>Θ(V)</b></td></tr>
    <tr><td>Is (u, v) an edge?</td><td><b>O(deg u)</b></td><td><b>Θ(1)</b></td></tr><tr><td>Edges into v</td><td><b>Θ(V + E)</b></td><td><b>Θ(V)</b></td></tr>
    <tr><td>BFS / DFS</td><td><b>Θ(V + E)</b></td><td><b>Θ(V²)</b></td></tr><tr><td>Best for</td><td>sparse graphs</td><td>dense graphs</td></tr></tbody></table>`;return;}
  $('#codeH').textContent='Pseudocode';let n=0;
  $('#code').innerHTML=mod.code.map(l=>{if(l.startsWith('§'))return `<div class="cl hd">${esc(l.slice(1))}</div>`;n++;
    let t=esc(l),cm='';const ci=t.indexOf('//');if(ci>=0){cm=`<span class="cm">${t.slice(ci)}</span>`;t=t.slice(0,ci);}
    t=t.replace(/\b(for|each|if|else|while|return|to|in|call)\b/g,'<span class="kw">$1</span>');
    return `<div class="cl" data-l="${n}"><span class="ln">${n}</span><span>${t}${cm}</span></div>`;}).join('');
}
function hlCode(line){
  const set=new Set([].concat(line==null?[]:line));const box=$('#code');let firstEl=null;
  box.querySelectorAll('.cl[data-l]').forEach(el=>{const on=set.has(+el.dataset.l);el.classList.toggle('on',on);if(on&&!firstEl)firstEl=el;});
  if(firstEl){const top=firstEl.offsetTop,bot=top+firstEl.offsetHeight;if(top<box.scrollTop||bot>box.scrollTop+box.clientHeight)box.scrollTop=Math.max(0,top-40);}
}
function askHTML(a,ans){
  const opts=a.opts.map(o=>{let cls='opt';if(ans){if(o===a.ans)cls+=' right';else if(o===ans)cls+=' wrong';}return `<button class="${cls}" data-o="${esc(o)}"${ans?' disabled':''}>${esc(o)}</button>`;}).join('');
  const fb=ans?`<p class="fb">${ans===a.ans?'<b class="ok">Correct.</b>':`<b class="no">Not quite.</b> The answer is <b>${esc(a.ans)}</b>.`} ${a.why||''}</p>`:'<p class="ask-hint">Answer to unlock Next, or switch off “Quiz me”.</p>';
  return `<div class="ask" id="ask"><div class="ask-h">Predict the next step</div><p class="q">${a.q}</p><div class="opts">${opts}</div>${fb}</div>`;
}
function renderNarr(){
  const s=steps[idx];
  let h=`<div class="nmeta"><span>Step ${idx+1} of ${steps.length}</span>${s.phase?`<span class="phase">${s.phase}</span>`:''}</div><h3>${s.title||''}</h3><p>${s.msg||''}</p>`;
  if(s.why)h+=`<div class="why"><b class="wl">Why it works</b>${s.why}</div>`;
  if(quiz&&s.ask)h+=askHTML(s.ask,answered[idx]);
  $('#narr').innerHTML=h;
  $('#narr').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(answered[idx])return;answered[idx]=b.dataset.o;score.t++;if(b.dataset.o===s.ask.ans)score.c++;renderScore();renderNarr();updButtons();});
}
function renderScore(){$('#score').innerHTML=`Quiz <b>${score.c}</b> / ${score.t} correct`;}
function blocked(){const s=steps[idx];return quiz&&s.ask&&!answered[idx];}
function updButtons(){
  $('#bPrev').disabled=idx===0;$('#bFirst').disabled=idx===0;$('#bNext').disabled=idx>=steps.length-1;
  $('#scrub').max=steps.length-1;$('#scrub').value=idx;$('#stepct').textContent=`${idx+1} / ${steps.length}`;
  $('#bPlay').textContent=timer?'❚❚ Pause':'▶ Play';
}
function show(i,instant){
  idx=Math.max(0,Math.min(steps.length-1,i));const s=steps[idx];curStep=s;
  let moving=false;
  G.nodes.forEach(n=>{const o=NO[n.id],ns=s.nodes[n.id];
    if(o.mesh)o.mesh.material.color.setHex(fillHex(ns.fill));
    o.sub.textContent=ns.sub||'';o.sub.hidden=!ns.sub;
    const p=s.pos&&s.pos[n.id]?s.pos[n.id]:n.p;o.to.set(p[0],p[1],p[2]);if(o.cur.distanceTo(o.to)>1e-3)moving=true;});
  if(moving){
    if(instant||reduce||!renderer){G.nodes.forEach(n=>{const o=NO[n.id];o.cur.copy(o.to);if(o.mesh){o.mesh.position.copy(o.cur);o.outline.position.copy(o.cur);}});}
    else{G.nodes.forEach(n=>NO[n.id].from.copy(NO[n.id].cur));anim={t0:performance.now(),dur:1000};}
    fit(n=>NO[n.id].to.clone(),false);
  }
  applyRoles();rebuildEdges();
  renderNarr();hlCode(s.line);$('#panel').innerHTML=s.panel||'';markSel();updButtons();
}
function next(){if(idx>=steps.length-1)return false;if(blocked()){const a=$('#ask');if(a){a.classList.remove('shake');void a.offsetWidth;a.classList.add('shake');}return false;}show(idx+1);return true;}
function stop(){if(timer){clearInterval(timer);timer=null;}updButtons();}
function play(){if(timer){stop();return;}if(idx>=steps.length-1)show(0);timer=setInterval(()=>{if(!next())stop();},+$('#speed').value);updButtons();}
function load(id,ex){
  stop();mod=MODS.find(m=>m.id===id)||MODS[0];exIdx=Math.min(ex||0,mod.examples.length-1);
  G=mkGraph(mod.examples[exIdx].g);steps=mod.run(G);answered={};sel=null;
  renderRail();renderLesson();buildScene();
  cam.theta=.55;cam.phi=1.13;fit(n=>new V3(...n.p),true);
  show(0,true);
}

/* ---------- wiring ---------- */
$('#bNext').onclick=()=>{stop();next();};
$('#bPrev').onclick=()=>{stop();show(idx-1);};
$('#bFirst').onclick=()=>{stop();show(0,true);};
$('#bPlay').onclick=play;
$('#scrub').oninput=e=>{stop();show(+e.target.value);};
$('#speed').onchange=()=>{if(timer){stop();play();}};
$('#quiz').checked=quiz;
$('#quiz').onchange=e=>{quiz=e.target.checked;store.set('gal-quiz',quiz);renderNarr();};
$('#zin').onclick=()=>{cam.gR=Math.max(5,cam.gR*.82);};
$('#zout').onclick=()=>{cam.gR=Math.min(70,cam.gR*1.22);};
$('#vreset').onclick=()=>{cam.theta=.55;cam.phi=1.13;fit(n=>NO[n.id].to.clone(),false);};
const sp=$('#vspin');sp.setAttribute('aria-pressed',String(spin));sp.onclick=()=>{spin=!spin;sp.setAttribute('aria-pressed',String(spin));};
$('#panel').addEventListener('click',e=>{const t=e.target.closest('[data-node]');if(t&&t.dataset.node)setSel(t.dataset.node);});
document.addEventListener('keydown',e=>{if(e.target.closest('input,select,textarea')||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='ArrowRight'){e.preventDefault();stop();next();}else if(e.key==='ArrowLeft'){e.preventDefault();stop();show(idx-1);}else if(e.key===' '&&!e.target.closest('button')){e.preventDefault();play();}else if(e.key==='Home'){stop();show(0,true);}});
const route=()=>{const h=location.hash.slice(1);load(MODS.some(m=>m.id===h)?h:'rep',0);};
window.addEventListener('hashchange',route);
renderScore();initThree();route();
})();
</script>
</body>
